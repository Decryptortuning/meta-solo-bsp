BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "solo-bsp"
BBFILE_PATTERN_solo-bsp := "^${LAYERDIR}/"
BBFILE_PRIORITY_solo-bsp = "7"

# Machines select the 3dr initramfs and board support from NXP/Freescale.
LAYERDEPENDS_solo-bsp = "core freescale-layer fsl-bsp-release 3dr"

LAYERSERIES_COMPAT_solo-bsp = "scarthgap"
