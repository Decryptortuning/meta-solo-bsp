# Wi-Fi stack and common Atheros support (Solo uses ath9k)
CONFIG_CFG80211=m
CONFIG_CFG80211_DEFAULT_PS=y
# CONFIG_CFG80211_REG_DEBUG is not set
CONFIG_MAC80211=m
# Linux 6.6 uses WLAN_VENDOR_ATH; ATH_CARDS no longer exists.
CONFIG_WLAN_VENDOR_ATH=y
# Atheros SDIO (ath6kl family) for broader module compatibility
CONFIG_ATH6KL=m
CONFIG_ATH6KL_SDIO=m
CONFIG_ATH9K=m
CONFIG_ATH9K_COMMON=m
CONFIG_ATH9K_HTC=m
CONFIG_ATH9K_PCI=y
# Linux 6.6 rate control is owned by mac80211, not the removed
# ATH9K_LEGACY_RATE_CONTROL option. Preserve the effective Minstrel HT default.
CONFIG_MAC80211_RC_MINSTREL=y
CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
CONFIG_MAC80211_RC_DEFAULT="minstrel_ht"

# Read-only counters for qualifying the unresolved controller beacon loss.
CONFIG_DEBUG_FS=y
CONFIG_MAC80211_DEBUGFS=y
CONFIG_ATH9K_DEBUGFS=y
CONFIG_WATCHDOG_SYSFS=y
