# NXP 6.6 / controller AR9300 qualification: root-port MSI Enable suppresses
# INTx, while MSI operation exhibits reproducible packet/completion stalls.
# Use the kernel's standard PCI policy, preserving bootloader root/console args.
CONFIG_CMDLINE="pci=nomsi"
# CONFIG_CMDLINE_FROM_BOOTLOADER is not set
CONFIG_CMDLINE_EXTEND=y
# CONFIG_CMDLINE_FORCE is not set
