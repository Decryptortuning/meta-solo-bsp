# Drone only: Linux 6.6 ADV7610 -> video-mux -> IPUv3 CSI media graph.
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_PLATFORM_SUPPORT=y
CONFIG_MEDIA_PLATFORM_DRIVERS=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_STAGING=y
CONFIG_STAGING_MEDIA=y
CONFIG_IMX_IPUV3_CORE=m
CONFIG_VIDEO_IMX_MEDIA=m
CONFIG_MULTIPLEXER=y
CONFIG_MUX_MMIO=y
CONFIG_VIDEO_MUX=m
CONFIG_VIDEO_ADV7604=m
# Do not bind the legacy IPU/capture stack to the same IPU hardware.
# CONFIG_MXC_IPU is not set
# CONFIG_MXC_IPU_V3 is not set
# CONFIG_VIDEO_MXC_CAPTURE is not set
# CONFIG_VIDEO_IMX_CAPTURE is not set
